name: device-manager-vps

x-api-env: &api-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 4000
  FRONTEND_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
  DATABASE_URL: postgresql://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automation}
  LOG_LEVEL: info

x-logs: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automation}
      POSTGRES_DB: ${POSTGRES_DB:-automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    restart: unless-stopped
    mem_limit: 512m
    logging: *logs
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
  migrate:
    image: device-manager-vps-backend:local
    command: [pnpm, db:migrate]
    environment: *api-env
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logs
  backend:
    image: device-manager-vps-backend:local
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
      target: backend
    environment: *api-env
    networks: [database, app]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 512m
    logging: *logs
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_DOMAIN}/api/v1
    environment:
      API_INTERNAL_BASE_URL: http://backend:4000/api/v1
      AUTH_FRONTEND_ORIGIN: https://${PUBLIC_DOMAIN}
    networks: [app]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 768m
    logging: *logs
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    image: caddy:2.11.6-alpine
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    depends_on:
      frontend: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 256m
    logging: *logs

networks:
  database: { internal: true }
  app: {}
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
