name: home-automation-local

x-postgres-environment: &postgres-environment
  POSTGRES_USER: ${POSTGRES_USER:-automation}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in compose .env}
  POSTGRES_DB: ${POSTGRES_DB:-automation}

x-api-environment: &api-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 4000
  FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-automation}
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-bookworm
    profiles: [stack]
    environment: *postgres-environment
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  postgres-dev:
    image: postgres:17-bookworm
    profiles: [native]
    environment: *postgres-environment
    ports: ['127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432']
    volumes: [postgres-dev-data:/var/lib/postgresql/data]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s

  migrate:
    profiles: [stack]
    image: home-automation-local-backend:latest
    command: [pnpm, db:migrate]
    environment: *api-environment
    networks: [internal]
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  backend:
    profiles: [stack]
    image: home-automation-local-backend:latest
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
      target: backend
    environment: *api-environment
    ports: ['127.0.0.1:${BACKEND_PORT:-4000}:4000']
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    profiles: [stack]
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-4000}/api/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
    environment:
      API_INTERNAL_BASE_URL: http://backend:4000/api/v1
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:3000']
    networks: [internal]
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 15s

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  postgres-dev-data:
